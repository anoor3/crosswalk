[project]
name = "crosswalk-api"
version = "0.1.0"
description = "Local HTTP service boundary for Crosswalk foundations."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115.0", "crosswalk-contracts", "crosswalk-jobs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crosswalk_api"]

[tool.uv.sources]
crosswalk-contracts = { workspace = true }
crosswalk-jobs = { workspace = true }
