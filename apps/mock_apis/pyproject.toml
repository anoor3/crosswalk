# ===========================================================================
# crosswalk-mock-apis
#
# Three hand-written mock external APIs (easy / medium / hard) that all express
# the SAME underlying claim data in deliberately different shapes. These stand
# in for real, unfamiliar customer APIs so Crosswalk's discovery, profiling,
# and mapping can be developed and benchmarked against a KNOWN answer.
#
# Ground-truth integrity (CHECKER §10): the correct mapping for each API lives
# in fixtures/external_apis/<difficulty>/ground_truth.json and is NEVER
# imported by, referenced in, or served from these apps.
# ===========================================================================

[project]
name = "crosswalk-mock-apis"
version = "0.1.0"
description = "Mock external claim APIs (easy/medium/hard) with hidden ground truth for benchmarking."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "crosswalk-canonical",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crosswalk_mock_apis"]

[tool.uv.sources]
crosswalk-canonical = { workspace = true }
