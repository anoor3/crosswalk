[project]
name = "crosswalk-multimodal"
version = "0.1.0"
description = "Typed document and image input boundaries for future extraction."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crosswalk_multimodal"]
