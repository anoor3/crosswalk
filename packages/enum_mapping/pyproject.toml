[project]
name = "crosswalk-enum-mapping"
version = "0.1.0"
description = "Safe external-to-canonical enum mapping for Crosswalk."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crosswalk_enum_mapping"]
