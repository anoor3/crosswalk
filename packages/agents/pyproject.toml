[project]
name = "crosswalk-agents"
version = "0.1.0"
description = "Bounded, audited investigation agent orchestration for Crosswalk."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8.0", "crosswalk-mapping"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crosswalk_agents"]

[tool.uv.sources]
crosswalk-mapping = { workspace = true }
