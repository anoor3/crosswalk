# ===========================================================================
# crosswalk-profiler
#
# Phase 3: value profiling. Computes deterministic per-field statistics from
# real sample payloads — data type, null rate, uniqueness, ranges, string
# lengths, patterns, and heuristic semantic-type detection (identifier /
# currency / date / enum-candidate).
#
# Hard rule (PLANNER §16, CHECKER §15): this is DETERMINISTIC statistics. No
# LLM. The profiler is reusable independently of any AI system. It never logs
# raw sensitive payload values unnecessarily.
# ===========================================================================

[project]
name = "crosswalk-profiler"
version = "0.1.0"
description = "Deterministic per-field value profiling for Crosswalk."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8.0",
    "crosswalk-discovery",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crosswalk_profiler"]

[tool.uv.sources]
crosswalk-discovery = { workspace = true }
