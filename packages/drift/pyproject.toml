[project]
name = "crosswalk-drift"
version = "0.1.0"
description = "Versioned schema fingerprints and drift events."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crosswalk_drift"]
