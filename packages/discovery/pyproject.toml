# ===========================================================================
# crosswalk-discovery
#
# Phase 2: OpenAPI discovery. Parses an unfamiliar OpenAPI specification into a
# normalized, deterministic internal representation (ApiCatalog) that the rest
# of Crosswalk — profiling, mapping, drift — consumes.
#
# Hard rule (PLANNER §15, CHECKER §14): this is DETERMINISTIC STRUCTURAL
# PARSING. No LLM is used here. Following $ref, flattening schemas, and
# detecting enums/nullable/required are all mechanical operations. Unsupported
# constructs are recorded EXPLICITLY, never dropped silently.
# ===========================================================================

[project]
name = "crosswalk-discovery"
version = "0.1.0"
description = "Deterministic OpenAPI -> ApiCatalog discovery for Crosswalk."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crosswalk_discovery"]
