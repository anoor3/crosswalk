[project]
name = "crosswalk-jobs"
version = "0.1.0"
description = "Trackable background work units for Crosswalk pipelines."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crosswalk_jobs"]
