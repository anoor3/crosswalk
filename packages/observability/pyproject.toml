[project]
name = "crosswalk-observability"
version = "0.1.0"
description = "Structured operational events and metrics for Crosswalk."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crosswalk_observability"]
