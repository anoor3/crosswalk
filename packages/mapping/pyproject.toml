[project]
name = "crosswalk-mapping"
version = "0.1.0"
description = "Inspectable deterministic field mapping for Crosswalk."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8.0",
    "crosswalk-canonical",
    "crosswalk-discovery",
    "crosswalk-profiler",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crosswalk_mapping"]

[tool.uv.sources]
crosswalk-canonical = { workspace = true }
crosswalk-discovery = { workspace = true }
crosswalk-profiler = { workspace = true }
