[project]
name = "crosswalk-testgen"
version = "0.1.0"
description = "Deterministic contract-test generation for Crosswalk adapters."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8.0", "crosswalk-adapters"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crosswalk_testgen"]

[tool.uv.sources]
crosswalk-adapters = { workspace = true }
