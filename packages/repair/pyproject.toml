[project]
name = "crosswalk-repair"
version = "0.1.0"
description = "Human-approved, evidence-backed repair proposals."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8.0", "crosswalk-drift"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crosswalk_repair"]

[tool.uv.sources]
crosswalk-drift = { workspace = true }
