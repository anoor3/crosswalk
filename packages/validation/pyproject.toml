[project]
name = "crosswalk-validation"
version = "0.1.0"
description = "Structured user validation feedback for integration reviews."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crosswalk_validation"]
