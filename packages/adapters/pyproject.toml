[project]
name = "crosswalk-adapters"
version = "0.1.0"
description = "Safe adapter specifications and deterministic code generation."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8.0", "crosswalk-mapping"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crosswalk_adapters"]

[tool.uv.sources]
crosswalk-mapping = { workspace = true }
