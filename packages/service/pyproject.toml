[project]
name = "crosswalk-service"
version = "0.1.0"
description = "Application services composing Crosswalk domain boundaries."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8.0", "crosswalk-jobs", "crosswalk-storage"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crosswalk_service"]

[tool.uv.sources]
crosswalk-jobs = { workspace = true }
crosswalk-storage = { workspace = true }
