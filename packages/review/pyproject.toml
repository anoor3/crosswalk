[project]
name = "crosswalk-review"
version = "0.1.0"
description = "Human review workflow for Crosswalk mapping candidates."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8.0",
    "crosswalk-mapping",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crosswalk_review"]

[tool.uv.sources]
crosswalk-mapping = { workspace = true }
