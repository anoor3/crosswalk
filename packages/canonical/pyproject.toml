# ===========================================================================
# crosswalk-canonical
#
# The "clean internal world": Crosswalk's canonical data model. Every external
# API is ultimately mapped *into* these types. This package is intentionally
# dependency-light (only Pydantic v2) so it can be imported by every other
# package — discovery, mapping, adapters, runtime — without pulling in web or
# database concerns.
# ===========================================================================

[project]
name = "crosswalk-canonical"
version = "0.1.0"
description = "Crosswalk canonical data model (Claim, Person, Policy, Financials)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crosswalk_canonical"]
