[project]
name = "crosswalk-relationships"
version = "0.1.0"
description = "Evidence-based cross-endpoint relationship discovery for Crosswalk."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8.0", "crosswalk-discovery", "crosswalk-profiler"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crosswalk_relationships"]

[tool.uv.sources]
crosswalk-discovery = { workspace = true }
crosswalk-profiler = { workspace = true }
